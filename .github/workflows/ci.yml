name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Python 3.13
        run: uv python install 3.13
      - name: Dependencias (lock)
        run: uv sync --locked --group dev
      - name: Testes
        run: uv run --no-sync python -m pytest -q
      - name: Compilacao sintatica
        run: uv run --no-sync python -m compileall -q src apps tests
